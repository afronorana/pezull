name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths: [demo/**, pezull.css, pezull.js, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Serve the demo at the site root, next to the library files it loads
      - run: |
          mkdir _site
          cp pezull.css pezull.js _site/
          sed 's#\.\./pezull\.#./pezull.#g' demo/index.html > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
